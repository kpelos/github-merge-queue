name: Release - Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Deploy Environment
        type: choice
        required: true
        options:
          - staging
          - production
          - homol
      config_path:
        description: Declarative Manifest Path
        type: string
        required: true
        default: kubernetes
      debug_mode:
        description: Enable Debug
        type: boolean
      sonar:
        description: Enable SonarCloud Analysis
        type: boolean
      docker_buildargs:
        description:
          Docker Build Args Base64 JSON Encoded OR Comma Separated List
          of Secrets or Environment Variables names to be used as Docker Build Args
        type: string
        required: false
        default: eyJlbXB0eSI6ICJlbXB0eSJ9 # '{"empty": "empty"}'
      apps_filter:
        description:
          JSON array string list of apps to build and deploy. If not set,
          all apps will be deployed
        type: string
        required: false
        default: '["bet-web-betnacional-bet-br", "bet-web-sandbox", "bet-web-webdevelopers-internal", "bet-web-webdevelopers", "revalidate-home-cron", "revalidate-home-cron-betnacional"]'
      steps:
        description: JSON array string list of steps to build, push, version and deploy
        type: string
        required: false
        default: '["build","push","versioning","deploy"]'

run-name: '[BetWeb] Deploy to ${{ inputs.environment }}'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fake deploy
        run: |
          echo "environment: ${{ inputs.environment }}"
          echo "config_path: ${{ inputs.config_path }}"
          echo "apps_filter: ${{ inputs.apps_filter }}"
          echo "steps: ${{ inputs.steps }}"
          echo "debug_mode: ${{ inputs.debug_mode }}"
          echo "sonar: ${{ inputs.sonar }}"
          echo "Deploy completed (fake)"
