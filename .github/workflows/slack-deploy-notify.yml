name: Slack Deploy Notification

on:
  pull_request:
    types: [labeled]

env:
  SLACK_CHANNEL_ID: C0AV882BL1E

jobs:
  notify:
    if: github.event.label.name == 'deploy' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1

      - name: Parse release PR body
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/parse-release.mjs

      - name: Post Slack message
        id: post_message
        if: steps.parse.outputs.found == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_DEPLOY_TRACKER_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_CHANNEL_ID }}"
            text: "🚀 Deploy ${{ steps.parse.outputs.app }}@${{ steps.parse.outputs.version }}\nPR: ${{ github.event.pull_request.html_url }}\nDevelopers:\n${{ steps.parse.outputs.devs_formatted }}"
            metadata:
              event_type: "release"
              event_payload:
                app: "${{ steps.parse.outputs.app }}"
                version: "${{ steps.parse.outputs.version }}"
                prNumber: ${{ github.event.pull_request.number }}
                prUrl: "${{ github.event.pull_request.html_url }}"
                devs: '${{ steps.parse.outputs.devs_json }}'

      # - name: Update message with metadata
      #   if: steps.parse.outputs.found == 'true'
